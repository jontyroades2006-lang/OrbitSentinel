<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OrbitSentinel — Conjunction Awareness &amp; Decision Support</title>

<link href="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.144/Build/Cesium/Cesium.js"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="cesiumContainer"></div>

  <!-- Top bar -->
  <header id="topbar">
    <div class="brand">
      <span class="brand-mark">◎</span>
      <div class="brand-text">
        <div class="brand-name">ORBIT<span class="accent">SENTINEL</span></div>
        <div class="brand-tag">Conjunction Awareness &amp; Decision Support</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="clock-block">
        <div class="clock-label">UTC</div>
        <div id="utcClock" class="clock-value">--:--:--</div>
      </div>
      <div class="status-pill" id="backendStatus">
        <span class="dot"></span> connecting…
      </div>
    </div>
  </header>

  <!-- Left control panel -->
  <aside id="leftPanel" class="panel">
    <div class="panel-section">
      <div class="panel-title">SEARCH CATALOG</div>
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Name, NORAD ID, operator…" autocomplete="off" />
        <button id="searchBtn" class="btn btn-ghost">Go</button>
      </div>
      <div id="searchResults" class="result-list"></div>
    </div>

    <div class="panel-section">
      <div class="panel-title">CONJUNCTION PAIR</div>
      <div class="pair-slot" id="primarySlot" data-role="primary">
        <div class="pair-slot-label">Primary <span class="pair-color primary-color"></span></div>
        <div class="pair-slot-value">— none selected —</div>
      </div>
      <div class="pair-slot" id="secondarySlot" data-role="secondary">
        <div class="pair-slot-label">Secondary <span class="pair-color secondary-color"></span></div>
        <div class="pair-slot-value">— none selected —</div>
      </div>
      <div class="pair-actions">
        <button id="clearPairBtn" class="btn btn-ghost small">Clear</button>
        <button id="analyzeBtn" class="btn btn-primary small" disabled>Analyze Conjunction</button>
      </div>
      <div class="window-row">
        <label for="hoursInput">Search window</label>
        <select id="hoursInput">
          <option value="6">6 hours</option>
          <option value="12">12 hours</option>
          <option value="24" selected>24 hours</option>
          <option value="48">48 hours</option>
          <option value="72">72 hours</option>
        </select>
      </div>
    </div>

    <div class="panel-section" id="viewControls">
      <div class="panel-title">VIEW</div>
      <button id="resetViewBtn" class="btn btn-ghost small full">Full Catalog View</button>
    </div>
  </aside>

  <!-- Satellite detail drawer -->
  <div id="detailDrawer" class="drawer hidden">
    <button class="drawer-close" id="detailCloseBtn">✕</button>
    <div id="detailContent"></div>
  </div>

  <!-- Conjunction alert card -->
  <div id="alertCard" class="alert-card hidden"></div>

  <!-- What-if panel -->
  <div id="whatIfPanel" class="whatif-panel hidden">
    <button class="drawer-close" id="whatIfCloseBtn">✕</button>
    <div class="panel-title">WHAT-IF SIMULATION</div>
    <div class="whatif-tabs">
      <button class="tab-btn active" data-mode="altitude">Altitude Change</button>
      <button class="tab-btn" data-mode="deltav">Delta-V (RTN)</button>
    </div>

    <div id="altitudeControls" class="whatif-mode">
      <label>Altitude change (km)</label>
      <input type="range" id="altitudeSlider" min="-50" max="50" step="0.5" value="5" />
      <div class="slider-readout"><span id="altitudeValue">+5.0</span> km</div>
    </div>

    <div id="deltavControls" class="whatif-mode hidden">
      <label>Radial (m/s)</label>
      <input type="number" id="dvRadial" value="0" step="1" />
      <label>In-track (m/s)</label>
      <input type="number" id="dvInTrack" value="100" step="1" />
      <label>Cross-track (m/s)</label>
      <input type="number" id="dvCrossTrack" value="0" step="1" />
    </div>

    <label>Maneuver time (minutes from now)</label>
    <input type="range" id="maneuverOffset" min="1" max="180" step="1" value="10" />
    <div class="slider-readout"><span id="maneuverOffsetValue">10</span> min</div>

    <button id="runWhatIfBtn" class="btn btn-primary full">Run Simulation</button>

    <div id="whatIfResults" class="whatif-results hidden"></div>
  </div>

  <!-- Quick-select popup for globe entity clicks -->
  <div id="quickSelectPopup" class="quick-select hidden">
    <div id="quickSelectName" class="quick-select-name"></div>
    <div class="quick-select-actions">
      <button id="qsPrimaryBtn" class="btn btn-ghost small">Set Primary</button>
      <button id="qsSecondaryBtn" class="btn btn-ghost small">Set Secondary</button>
    </div>
  </div>

  <div id="loadingOverlay" class="loading-overlay">
    <div class="loading-inner">
      <div class="spinner"></div>
      <div>Initializing globe…</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
